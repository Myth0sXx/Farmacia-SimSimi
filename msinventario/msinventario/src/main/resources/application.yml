spring:
  application:
    name: ms-inventario  # Ajustado al estándar del ecosistema Farmacia VM
  datasource:
    url: jdbc:mysql://localhost:3306/db_ms_inventario_vm
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

server:
  port: 8086  # Puerto físico asignado a inventario

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

# Swagger / OpenAPI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

logging:
  level:
    root: INFO
    com:
      farmacia:
        msinventario: DEBUG  # Cambiar según el nombre exacto de tu paquete base
    org:
      hibernate:
        SQL: DEBUG

