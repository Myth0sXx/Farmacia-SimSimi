server:
  port: 8089

spring:
  application:
    name: mscliente

  datasource:
    url: jdbc:mysql://localhost:3306/db_ms_cliente_vm
    username: root
    password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

  instance:
    prefer-ip-address: true

logging:
  level:
    root: INFO
    com.farmacia: DEBUG

springdoc:
  api-docs:
    path: /v3/api-docs

  swagger-ui:
    path: /swagger-ui.html