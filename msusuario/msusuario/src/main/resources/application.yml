eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/

  instance:
    prefer-ip-address: true

spring:
  application:
    name: msusuario

  datasource:
    url: jdbc:mysql://localhost:3306/db_ms_usuarios_vm
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        format_sql: true

server:
  port: 8089

springdoc:
  api-docs:
    path: /v3/api-docs

  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

logging:
  level:
    com.farmacia.msusuario: DEBUG
    root: INFO


    # Si MySQL está en Docker Compose
    spring:
      datasource:
        url: jdbc:mysql://mysql:3306/db_ms_usuarios_vm
        username: root
        password: root